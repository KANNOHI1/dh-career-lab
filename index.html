<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230f766e%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27serif%27%3E%E6%AD%AF%3C/text%3E%3C/svg%3E">
<title>歯科衛生士キャリアラボ</title>
<style>
:root {
  --bg: #fbfaf8; --fg: #1c1a17; --muted: #6b655c;
  --line: #e2ddd4; --card: #ffffff; --accent: #0f766e;
  --accent-soft: #d7f0ec; --warn: #9a5b00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513; --fg: #eeeae3; --muted: #9a938a;
    --line: #302d29; --card: #1e1d1a; --accent: #5eead4;
    --accent-soft: #16403c; --warn: #e0b070;
  }
}
:root[data-theme="dark"] {
  --bg: #161513; --fg: #eeeae3; --muted: #9a938a;
  --line: #302d29; --card: #1e1d1a; --accent: #5eead4;
  --accent-soft: #16403c; --warn: #e0b070;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 1.5rem 1.1rem 5rem;
  background: var(--bg); color: var(--fg);
  font-family: system-ui, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  line-height: 1.8; font-size: 16px;
}
main { max-width: 40rem; margin: 0 auto; }
h1 { font-size: 1.35rem; margin: 0 0 .3rem; letter-spacing: .02em; }
h2 { font-size: 1.1rem; margin: 0 0 .3rem; }
h3 { font-size: .95rem; margin: 2rem 0 .6rem; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); font-size: .85rem; margin: 0 0 1.5rem; }

.privacy {
  border: 1px solid var(--line); border-radius: .5rem;
  padding: .8rem 1rem; margin: 0 0 1.5rem;
  font-size: .85rem; color: var(--muted); background: var(--card);
}
.privacy strong { color: var(--fg); font-weight: 600; }

.progress { display: flex; gap: .3rem; margin: 0 0 1.5rem; }
.progress span {
  flex: 1; height: 3px; border-radius: 2px; background: var(--line);
}
.progress span.done { background: var(--accent); }

.step { display: none; }
.step.active { display: block; }
.step-head { margin: 0 0 1.5rem; }
.step-head .n { font-size: .75rem; color: var(--accent); letter-spacing: .1em; font-weight: 700; }
.step-head .note { font-size: .85rem; color: var(--muted); margin: .4rem 0 0; }

.q { margin: 0 0 1.75rem; }
.q > label.qt, .q > .qt {
  display: block; font-weight: 600; margin: 0 0 .1rem; font-size: .95rem;
}
.q .hint { font-size: .8rem; color: var(--muted); margin: 0 0 .55rem; }

.opts { display: flex; flex-wrap: wrap; gap: .4rem; }
.opts label {
  display: inline-flex; align-items: center; gap: .35rem;
  border: 1px solid var(--line); border-radius: 2rem;
  padding: .35rem .8rem; font-size: .875rem; cursor: pointer;
  background: var(--card); user-select: none;
}
.opts label:has(input:checked) {
  border-color: var(--accent); background: var(--accent-soft);
}
.opts input { accent-color: var(--accent); margin: 0; }

input[type="number"], input[type="text"], select, textarea {
  font: inherit; font-size: .9rem; color: var(--fg); background: var(--card);
  border: 1px solid var(--line); border-radius: .4rem;
  padding: .45rem .6rem; max-width: 100%;
}
input[type="number"] { width: 6rem; }
select { width: 100%; max-width: 20rem; }
textarea { width: 100%; min-height: 5rem; line-height: 1.7; resize: vertical; }
.subq { margin: .5rem 0 0 .2rem; font-size: .875rem; }
.subq div { display: flex; align-items: center; gap: .5rem; margin: .3rem 0; }
.subq span.lb { min-width: 8.5rem; }

.nav { display: flex; gap: .6rem; margin: 2.5rem 0 0; align-items: center; }
button {
  font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer;
  border-radius: .4rem; padding: .6rem 1.4rem; border: 1px solid var(--accent);
  background: var(--accent); color: var(--bg);
}
button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
button.link { background: none; border: none; color: var(--muted); text-decoration: underline; padding: .4rem 0; font-weight: 400; }

.card {
  border: 1px solid var(--line); border-radius: .6rem; background: var(--card);
  padding: 1.1rem 1.2rem; margin: 0 0 1rem;
}
.card .big { font-size: 1.6rem; font-weight: 700; line-height: 1.3; display: block; margin: .2rem 0; }
.card .cap { font-size: .8rem; color: var(--muted); }
.card .src { font-size: .72rem; color: var(--muted); margin: .6rem 0 0; word-break: break-all; }
.card.flag { border-color: var(--accent); }

.unknown {
  border: 1px dashed var(--line); border-radius: .6rem;
  padding: 1rem 1.2rem; margin: 0 0 1rem; font-size: .875rem; color: var(--muted);
}
.tag {
  display: inline-block; font-size: .72rem; padding: .1rem .5rem;
  border-radius: 2rem; border: 1px solid var(--line); color: var(--muted); margin: 0 0 .5rem;
}
ul.plain { padding-left: 1.2rem; margin: .4rem 0; }
ul.plain li { margin: .3rem 0; }
.copy { width: 100%; min-height: 12rem; font-size: .8rem; font-family: ui-monospace, monospace; }
footer { margin: 3.5rem 0 0; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); padding: 1rem 0 0; }
</style>
</head>
<body>
<main>
  <h1>歯科衛生士キャリアラボ</h1>
  <p class="sub">これまでの経験を、事実として並べ直すための質問です。</p>

  <div class="privacy">
    <strong>回答は自動送信されません。公開も検索もされません。</strong><br>
    答えたくない項目は空欄のまま進めます。途中でやめても大丈夫です。
  </div>

  <div class="progress" id="progress"></div>
  <div id="steps"></div>

  <footer>
    出典つきの統計は <span id="srccount">—</span> 件。数値の根拠は結果画面に併記しています。
  </footer>
</main>

<script src="data/market.js"></script>
<script src="data/certifications.js"></script>
<script src="data/salary.js"></script>
<script src="data/tracks.js"></script>
<script src="app.js"></script>
</body>
</html>
